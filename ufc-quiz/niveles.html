<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz UFC · Por Módulos y Niveles</title>
<style>
  :root{
    --bg:#0b0c10; --bg2:#14161c; --card:#1a1d25; --border:#2a2e3a;
    --red:#d20a0a; --red2:#ff2b2b; --gold:#e8b923; --text:#f2f3f5;
    --muted:#9aa0ad; --green:#2ecc71; --wrong:#ff4d4d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,Arial,sans-serif;
    background:radial-gradient(circle at top, #1c1f27 0%, var(--bg) 70%);
    color:var(--text); min-height:100vh; padding:24px 14px 60px;
  }
  .wrap{max-width:820px; margin:0 auto;}
  header{text-align:center; margin-bottom:24px;}
  header h1{
    font-size:2.1rem; margin:0; letter-spacing:1px;
    text-transform:uppercase; color:var(--text);
  }
  header h1 span{color:var(--red2);}
  header p{color:var(--muted); margin-top:6px;}
  .badge{
    display:inline-block; background:var(--gold); color:#1a1500;
    font-weight:700; font-size:.75rem; padding:3px 10px; border-radius:20px;
    margin-top:10px; letter-spacing:.5px;
  }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:22px; margin-bottom:18px; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .setup-grid{display:grid; grid-template-columns:1fr; gap:14px;}
  .field label{display:block; font-size:.85rem; color:var(--muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px;}
  select{
    width:100%; padding:12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:1rem;
  }
  .btn{
    background:linear-gradient(135deg, var(--red2), var(--red));
    color:#fff; border:none; padding:14px 20px; border-radius:12px;
    font-weight:700; font-size:1rem; cursor:pointer; width:100%;
    text-transform:uppercase; letter-spacing:.5px; margin-top:6px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(210,10,10,.4);}
  .btn.secondary{
    background:var(--bg2); border:1px solid var(--border); color:var(--text);
  }
  .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}
  #quiz-area{display:none;}
  .progress-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; color:var(--muted); font-size:.85rem;}
  .progress-bar{height:8px; background:var(--bg2); border-radius:6px; overflow:hidden; margin-bottom:18px; border:1px solid var(--border);}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--red2)); width:0%; transition:width .3s ease;}
  .tag-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .tag{font-size:.72rem; padding:4px 10px; border-radius:20px; border:1px solid var(--border); color:var(--muted); text-transform:uppercase;}
  .tag.level-principiante{border-color:#2ecc71; color:#2ecc71;}
  .tag.level-medio{border-color:var(--gold); color:var(--gold);}
  .tag.level-avanzado{border-color:var(--red2); color:var(--red2);}
  .question{font-size:1.15rem; font-weight:600; margin-bottom:18px; line-height:1.4;}
  .options{display:grid; gap:10px;}
  .option{
    text-align:left; padding:14px 16px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); cursor:pointer; font-size:.98rem;
    transition:background .15s ease, border-color .15s ease;
  }
  .option:hover{border-color:var(--gold);}
  .option.correct{background:rgba(46,204,113,.15); border-color:var(--green); color:var(--green);}
  .option.wrong{background:rgba(255,77,77,.15); border-color:var(--wrong); color:var(--wrong);}
  .option:disabled{cursor:default;}
  .explain{
    margin-top:14px; padding:12px 14px; background:var(--bg2); border-left:3px solid var(--gold);
    border-radius:8px; font-size:.9rem; color:var(--muted); display:none;
  }
  .nav-row{display:flex; gap:10px; margin-top:18px;}
  #result-area{display:none; text-align:center;}
  #result-area .score{font-size:3rem; font-weight:800; color:var(--gold); margin:10px 0;}
  #result-area .msg{font-size:1.1rem; margin-bottom:20px; color:var(--muted);}
  .review-item{
    text-align:left; padding:12px 14px; border-radius:10px; margin-bottom:10px;
    border:1px solid var(--border); background:var(--bg2);
  }
  .review-item.ok{border-left:4px solid var(--green);}
  .review-item.bad{border-left:4px solid var(--wrong);}
  footer{text-align:center; color:var(--muted); font-size:.8rem; margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>UFC <span>Quiz</span> · Módulos</h1>
    <p>Pon a prueba tus conocimientos de MMA por temática y nivel de dificultad</p>
    <span class="badge" id="bank-count"></span>
  </header>

  <div class="card" id="setup-card">
    <div class="setup-grid">
      <div class="field">
        <label for="module-select">Módulo</label>
        <select id="module-select">
          <option value="all">Todos los módulos (examen completo)</option>
        </select>
      </div>
      <div class="field">
        <label for="level-select">Nivel</label>
        <select id="level-select">
          <option value="all">Todos los niveles</option>
          <option value="principiante">Principiante</option>
          <option value="medio">Medio</option>
          <option value="avanzado">Avanzado</option>
        </select>
      </div>
      <div class="field">
        <label for="order-select">Orden</label>
        <select id="order-select">
          <option value="ordenado">Por módulo y nivel</option>
          <option value="aleatorio">Aleatorio</option>
        </select>
      </div>
    </div>
    <button class="btn" id="start-btn">Empezar quiz</button>
  </div>

  <div id="quiz-area">
    <div class="progress-row">
      <span id="progress-text">Pregunta 1</span>
      <span id="score-live">Aciertos: 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="card">
      <div class="tag-row">
        <span class="tag" id="tag-module"></span>
        <span class="tag" id="tag-level"></span>
      </div>
      <div class="question" id="question-text"></div>
      <div class="options" id="options-list"></div>
      <div class="explain" id="explain-box"></div>
      <div class="nav-row">
        <button class="btn secondary" id="quit-btn">Salir</button>
        <button class="btn" id="next-btn" disabled>Siguiente</button>
      </div>
    </div>
  </div>

  <div class="card" id="result-area">
    <div>Resultado final</div>
    <div class="score" id="final-score">0/0</div>
    <div class="msg" id="final-msg"></div>
    <button class="btn" id="restart-btn">Volver a intentarlo</button>
    <div id="review-list" style="margin-top:20px; text-align:left;"></div>
  </div>

  <footer>Quiz educativo sobre UFC/MMA · Uso informativo</footer>
</div>

<script>
const QUESTIONS = [
  // ===== HISTORIA Y ORÍGENES =====
  {module:"Historia y Orígenes", level:"principiante", q:"¿En qué año se celebró el primer evento de la UFC?", options:["1993","1988","1996","2001"], answer:0, explain:"UFC 1 se celebró el 12 de noviembre de 1993 en Denver, Colorado."},
  {module:"Historia y Orígenes", level:"principiante", q:"¿Qué significan las siglas UFC?", options:["United Fighters Cup","Ultimate Fighting Championship","Union of Fighting Combat","Universal Fight Circuit"], answer:1, explain:"UFC son las siglas de Ultimate Fighting Championship."},
  {module:"Historia y Orígenes", level:"principiante", q:"¿Qué disciplina hizo famoso al ganador de los primeros torneos de UFC, Royce Gracie?", options:["Boxeo","Karate","Jiu-Jitsu Brasileño","Judo"], answer:2, explain:"Royce Gracie demostró la eficacia del Jiu-Jitsu Brasileño ante estilos de striking."},
  {module:"Historia y Orígenes", level:"medio", q:"¿Quién es el presidente de la UFC desde 2001?", options:["Lorenzo Fertitta","Dana White","Ari Emanuel","Bruce Buffer"], answer:1, explain:"Dana White ha sido el presidente y rostro público de la UFC desde 2001."},
  {module:"Historia y Orígenes", level:"medio", q:"¿En qué ciudad se celebró UFC 1?", options:["Las Vegas","Denver","Nueva York","Miami"], answer:1, explain:"El McNichols Sports Arena de Denver acogió el evento fundacional."},
  {module:"Historia y Orígenes", level:"medio", q:"¿Qué empresa compró la UFC en 2016 por unos 4.000 millones de dólares?", options:["WWE","Endeavor (WME-IMG)","ESPN","Live Nation"], answer:1, explain:"WME-IMG (hoy Endeavor) adquirió la UFC en 2016."},
  {module:"Historia y Orígenes", level:"avanzado", q:"¿Quiénes eran los hermanos que compraron la UFC en el año 2001 junto a Dana White?", options:["Los hermanos Diaz","Los hermanos Fertitta","Los hermanos Klitschko","Los hermanos Nogueira"], answer:1, explain:"Lorenzo y Frank Fertitta compraron la UFC en 2001 a través de Zuffa LLC."},
  {module:"Historia y Orígenes", level:"avanzado", q:"¿Cómo se llamaba la empresa matriz creada por los Fertitta y Dana White para operar la UFC?", options:["Zuffa LLC","Octagon Inc.","Fight Corp","White Promotions"], answer:0, explain:"Zuffa LLC fue la compañía que gestionó la UFC entre 2001 y 2016."},
  {module:"Historia y Orígenes", level:"avanzado", q:"¿En qué evento se implementaron por primera vez de forma completa las 'Reglas Unificadas de MMA'?", options:["UFC 28 (2000, Nueva Jersey)","UFC 1 (1993)","UFC 100 (2009)","UFC 50 (2004)"], answer:0, explain:"UFC 28, celebrado en Nueva Jersey en el año 2000, fue el primer evento bajo las reglas unificadas."},

  // ===== REGLAS Y REGLAMENTO =====
  {module:"Reglas y Reglamento", level:"principiante", q:"¿Cuántos lados tiene el octágono de la UFC?", options:["Seis","Ocho","Diez","Doce"], answer:1, explain:"La jaula se llama 'octágono' porque tiene ocho lados."},
  {module:"Reglas y Reglamento", level:"principiante", q:"¿Cuánto dura normalmente un asalto (round) en la UFC?", options:["3 minutos","5 minutos","10 minutos","2 minutos"], answer:1, explain:"Cada asalto dura 5 minutos, con 1 minuto de descanso entre ellos."},
  {module:"Reglas y Reglamento", level:"principiante", q:"¿Cuántos asaltos tiene normalmente una pelea que no es de título ni estelar?", options:["1","3","5","7"], answer:1, explain:"Las peleas normales constan de 3 asaltos de 5 minutos."},
  {module:"Reglas y Reglamento", level:"medio", q:"¿Cuántos asaltos tiene una pelea por el título o un combate estelar (main event)?", options:["3","4","5","6"], answer:2, explain:"Los combates de título y los main events se disputan a 5 asaltos."},
  {module:"Reglas y Reglamento", level:"medio", q:"¿Qué sistema de puntuación usan los jueces en la UFC?", options:["Sistema de 10 puntos obligatorios (10-point must)","Puntos acumulativos sin límite","Solo victoria o derrota por asalto","Sistema de tarjetas de colores"], answer:0, explain:"Se usa el sistema '10-point must system', igual que en el boxeo."},
  {module:"Reglas y Reglamento", level:"medio", q:"¿Cuál de estas acciones está prohibida en la UFC?", options:["Codazos","Rodillazos al cuerpo","Golpes en la nuca","Derribos"], answer:2, explain:"Los golpes a la parte trasera de la cabeza y columna están prohibidos por seguridad."},
  {module:"Reglas y Reglamento", level:"medio", q:"¿Qué tipo de guantes se usan en la UFC?", options:["Guantes cerrados de boxeo","Guantes de MMA de dedos abiertos (aprox. 4 oz)","Sin guantes","Guantes de kickboxing de 10 oz"], answer:1, explain:"Se usan guantes acolchados de dedos abiertos de unas 4-6 onzas, que permiten agarrar y golpear."},
  {module:"Reglas y Reglamento", level:"avanzado", q:"¿Cuántos jueces puntúan un combate desde el borde del octágono?", options:["1","2","3","5"], answer:2, explain:"Hay tres jueces cageside que puntúan cada asalto de forma independiente."},
  {module:"Reglas y Reglamento", level:"avanzado", q:"¿Qué organismo supervisó el programa antidopaje de la UFC entre 2015 y 2023?", options:["WADA directamente","USADA","NSAC","VADA"], answer:1, explain:"La USADA (Agencia Antidopaje de EE.UU.) gestionó el programa antidopaje de la UFC desde 2015."},
  {module:"Reglas y Reglamento", level:"avanzado", q:"¿Qué margen de tolerancia de peso se permite habitualmente en el pesaje de un combate que no es de título?", options:["0.5 libras","1 libra","3 libras","5 libras"], answer:1, explain:"Para peleas no titulares suele permitirse 1 libra de margen sobre el límite de categoría."},

  // ===== TÉCNICAS Y ESTILOS =====
  {module:"Técnicas y Estilos", level:"principiante", q:"¿Cómo se llama la sumisión que ataca el brazo estirándolo por el codo?", options:["Armbar (llave de brazo)","Guillotina","Rear-naked choke","Kimura"], answer:0, explain:"El armbar hiperextiende la articulación del codo."},
  {module:"Técnicas y Estilos", level:"principiante", q:"¿Qué es un 'takedown'?", options:["Un golpe de puño potente","Un derribo para llevar al rival al suelo","Una patada giratoria","Un tipo de sumisión"], answer:1, explain:"El takedown es la técnica para derribar al oponente y llevar la pelea al suelo."},
  {module:"Técnicas y Estilos", level:"principiante", q:"¿Qué disciplina se centra principalmente en golpes de puño?", options:["Boxeo","Jiu-Jitsu","Lucha libre (wrestling)","Judo"], answer:0, explain:"El boxeo es el arte del golpeo con los puños."},
  {module:"Técnicas y Estilos", level:"medio", q:"¿Cómo se llama la estrangulación que se aplica por la espalda del rival rodeando el cuello?", options:["Kimura","Rear-naked choke","Americana","Heel hook"], answer:1, explain:"El rear-naked choke (RNC) se aplica desde la espalda rodeando el cuello con el brazo."},
  {module:"Técnicas y Estilos", level:"medio", q:"¿Qué es el 'ground and pound'?", options:["Golpear al rival mientras está en el suelo dominándolo","Una técnica de derribo","Un tipo de patada","Una estrangulación desde la guardia"], answer:0, explain:"Consiste en golpear al oponente desde una posición dominante en el suelo."},
  {module:"Técnicas y Estilos", level:"medio", q:"¿A qué se llama 'clinch' en MMA?", options:["A un golpe bajo ilegal","Al agarre cuerpo a cuerpo de pie","A una sumisión de pierna","A la posición de guardia cerrada"], answer:1, explain:"El clinch es el agarre a corta distancia, muy usado en el Muay Thai para rodillazos."},
  {module:"Técnicas y Estilos", level:"avanzado", q:"¿Cómo se llama la sumisión de pierna que ataca la articulación del tobillo con rotación?", options:["Kneebar","Heel hook","Calf slicer","Toe hold"], answer:1, explain:"El heel hook rota el talón generando torsión peligrosa en tobillo y rodilla."},
  {module:"Técnicas y Estilos", level:"avanzado", q:"¿Qué diferencia principal hay entre un Kimura y una Americana?", options:["No hay diferencia, son sinónimos","La dirección de rotación del hombro/brazo","El Kimura solo se aplica de pie","La Americana solo funciona en mujeres"], answer:1, explain:"Ambas atacan el hombro, pero se diferencian en la dirección de la palanca aplicada al brazo."},
  {module:"Técnicas y Estilos", level:"avanzado", q:"¿Qué término describe controlar la espalda del rival con ambos ganchos (hooks) colocados?", options:["Mount (montada)","Back control / back mount","Full guard","Half guard"], answer:1, explain:"El 'back control' con hooks es una de las posiciones más dominantes en grappling."},

  // ===== CAMPEONES Y RÉCORDS =====
  {module:"Campeones y Récords", level:"principiante", q:"¿Quién fue el primer campeón femenino de la historia de la UFC?", options:["Amanda Nunes","Ronda Rousey","Cris Cyborg","Holly Holm"], answer:1, explain:"Ronda Rousey fue la primera campeona de peso gallo femenino de la UFC."},
  {module:"Campeones y Récords", level:"principiante", q:"¿Qué peleador es conocido como 'The Notorious'?", options:["Khabib Nurmagomedov","Conor McGregor","Nate Diaz","Jon Jones"], answer:1, explain:"Conor McGregor es apodado 'The Notorious'."},
  {module:"Campeones y Récords", level:"principiante", q:"¿En qué categoría de peso compitió principalmente Anderson Silva durante su reinado más largo?", options:["Peso wélter","Peso medio (middleweight)","Peso ligero","Peso pesado"], answer:1, explain:"Anderson Silva dominó la división de peso medio durante casi siete años."},
  {module:"Campeones y Récords", level:"medio", q:"¿Qué peleador ruso se retiró invicto con un récord de 29-0?", options:["Islam Makhachev","Fedor Emelianenko","Khabib Nurmagomedov","Magomed Ankalaev"], answer:2, explain:"Khabib Nurmagomedov se retiró en 2020 con un récord perfecto de 29 victorias y 0 derrotas."},
  {module:"Campeones y Récords", level:"medio", q:"¿Quién fue el primer luchador en ostentar cinturones de la UFC en dos divisiones de peso simultáneamente?", options:["Georges St-Pierre","Conor McGregor","BJ Penn","Randy Couture"], answer:1, explain:"Conor McGregor logró esta hazaña al ganar el título ligero teniendo ya el de pluma en 2016."},
  {module:"Campeones y Récords", level:"medio", q:"¿Quién es considerada por muchos la mejor peleadora femenina de la historia de la UFC, con doble título simultáneo?", options:["Valentina Shevchenko","Amanda Nunes","Zhang Weili","Julianna Peña"], answer:1, explain:"Amanda Nunes ('The Lioness') mantuvo los títulos de peso gallo y pluma a la vez."},
  {module:"Campeones y Récords", level:"avanzado", q:"¿Quién ostenta el récord de más defensas de título consecutivas en la historia de la UFC (peso mosca)?", options:["Demetrious Johnson","Jon Jones","Georges St-Pierre","Israel Adesanya"], answer:0, explain:"Demetrious 'Mighty Mouse' Johnson defendió el título de peso mosca 11 veces consecutivas."},
  {module:"Campeones y Récords", level:"avanzado", q:"¿Quién ostenta el récord de golpes significativos conectados en la historia de la UFC?", options:["Max Holloway","Nate Diaz","Donald Cerrone","Jim Miller"], answer:0, explain:"Max Holloway es el líder histórico en golpes significativos conectados en la UFC."},
  {module:"Campeones y Récords", level:"avanzado", q:"¿Qué peleador impuso el récord del golpe más potente jamás medido por el sistema Power Watt de la UFC Performance Institute?", options:["Derrick Lewis","Francis Ngannou","Ciryl Gane","Curtis Blaydes"], answer:1, explain:"Francis Ngannou registró la fuerza de golpeo más alta medida en el UFC PI."},

  // ===== CULTURA Y DATOS CURIOSOS =====
  {module:"Cultura y Datos Curiosos", level:"principiante", q:"¿Cómo se llama el anunciador oficial que presenta a los peleadores dentro del octágono con la frase 'It's time!'?", options:["Joe Rogan","Bruce Buffer","Jon Anik","Daniel Cormier"], answer:1, explain:"Bruce Buffer es el locutor histórico del octágono."},
  {module:"Cultura y Datos Curiosos", level:"principiante", q:"¿Qué comentarista de la UFC también es conocido por su podcast y su carrera en comedia?", options:["Joe Rogan","Jon Anik","Michael Bisping","Daniel Cormier"], answer:0, explain:"Joe Rogan ha sido comentarista de color en la UFC durante más de dos décadas."},
  {module:"Cultura y Datos Curiosos", level:"medio", q:"¿Qué marca deportiva fue el proveedor exclusivo de uniformes de la UFC entre 2015 y 2020?", options:["Nike","Reebok","Under Armour","Venum"], answer:1, explain:"Reebok tuvo el contrato exclusivo de indumentaria antes de que Venum tomara el relevo en 2021."},
  {module:"Cultura y Datos Curiosos", level:"medio", q:"¿Qué serie/reality show de la UFC ayudó a popularizar la promoción en Estados Unidos a partir de 2005?", options:["UFC Embedded","The Ultimate Fighter (TUF)","UFC Unleashed","Dana White's Contender Series"], answer:1, explain:"The Ultimate Fighter, con Forrest Griffin y Stephan Bonnar en la final, revitalizó la popularidad de la UFC."},
  {module:"Cultura y Datos Curiosos", level:"avanzado", q:"¿En qué evento se enfrentaron Forrest Griffin y Stephan Bonnar en una pelea considerada clave para el resurgir de la UFC?", options:["Finale de la primera temporada de TUF (2005)","UFC 100","UFC 1","UFC 50"], answer:0, explain:"Su pelea en la final de la primera temporada de The Ultimate Fighter es histórica por su intensidad y repercusión."},
  {module:"Cultura y Datos Curiosos", level:"avanzado", q:"¿Qué evento de la UFC es recordado como uno de los más taquilleros por el enfrentamiento entre Khabib Nurmagomedov y Conor McGregor?", options:["UFC 205","UFC 229","UFC 264","UFC 246"], answer:1, explain:"UFC 229 (2018) batió récords de pago por visión con ese combate."},
];

// Build module list dynamically
const moduleSelect = document.getElementById('module-select');
const modules = [...new Set(QUESTIONS.map(q => q.module))];
modules.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m; opt.textContent = m;
  moduleSelect.appendChild(opt);
});
document.getElementById('bank-count').textContent = `Banco total: ${QUESTIONS.length} preguntas`;

let pool = [];
let current = 0;
let score = 0;
let answered = false;
let history = [];

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

document.getElementById('start-btn').addEventListener('click', () => {
  const mod = moduleSelect.value;
  const lvl = document.getElementById('level-select').value;
  const order = document.getElementById('order-select').value;

  pool = QUESTIONS.filter(q =>
    (mod === 'all' || q.module === mod) &&
    (lvl === 'all' || q.level === lvl)
  );

  if(pool.length === 0){
    alert('No hay preguntas para esa combinación. Prueba otra selección.');
    return;
  }
  if(order === 'aleatorio'){
    pool = shuffle(pool);
  }

  current = 0; score = 0; history = [];
  document.getElementById('setup-card').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  document.getElementById('result-area').style.display = 'none';
  renderQuestion();
});

function renderQuestion(){
  answered = false;
  const item = pool[current];
  document.getElementById('progress-text').textContent = `Pregunta ${current+1} de ${pool.length}`;
  document.getElementById('score-live').textContent = `Aciertos: ${score}`;
  document.getElementById('progress-fill').style.width = `${(current/pool.length)*100}%`;
  document.getElementById('tag-module').textContent = item.module;
  const lvlTag = document.getElementById('tag-level');
  lvlTag.textContent = item.level.charAt(0).toUpperCase() + item.level.slice(1);
  lvlTag.className = 'tag level-' + item.level;
  document.getElementById('question-text').textContent = item.q;

  const optsWrap = document.getElementById('options-list');
  optsWrap.innerHTML = '';
  item.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectOption(idx));
    optsWrap.appendChild(btn);
  });

  document.getElementById('explain-box').style.display = 'none';
  document.getElementById('next-btn').disabled = true;
}

function selectOption(idx){
  if(answered) return;
  answered = true;
  const item = pool[current];
  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if(i === item.answer) btn.classList.add('correct');
    else if(i === idx) btn.classList.add('wrong');
  });
  const correct = idx === item.answer;
  if(correct) score++;
  history.push({...item, userCorrect: correct});
  document.getElementById('score-live').textContent = `Aciertos: ${score}`;
  const explainBox = document.getElementById('explain-box');
  explainBox.textContent = item.explain;
  explainBox.style.display = 'block';
  document.getElementById('next-btn').disabled = false;
}

document.getElementById('next-btn').addEventListener('click', () => {
  current++;
  if(current >= pool.length){
    showResults();
  } else {
    renderQuestion();
  }
});

document.getElementById('quit-btn').addEventListener('click', () => {
  if(confirm('¿Seguro que quieres salir? Perderás el progreso.')){
    document.getElementById('quiz-area').style.display = 'none';
    document.getElementById('setup-card').style.display = 'block';
  }
});

function showResults(){
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('quiz-area').style.display = 'none';
  document.getElementById('result-area').style.display = 'block';
  document.getElementById('final-score').textContent = `${score}/${pool.length}`;
  const pct = Math.round((score/pool.length)*100);
  let msg;
  if(pct >= 90) msg = '¡Nivel campeón! Dominas la UFC.';
  else if(pct >= 70) msg = 'Muy buen nivel, sigues los combates de cerca.';
  else if(pct >= 50) msg = 'Nivel decente, pero aún hay margen de mejora.';
  else msg = 'Te toca ver más peleas y repasar los conceptos.';
  document.getElementById('final-msg').textContent = `${pct}% de aciertos · ${msg}`;

  const reviewList = document.getElementById('review-list');
  reviewList.innerHTML = '<h3 style="color:var(--muted); text-transform:uppercase; font-size:.85rem;">Repaso</h3>';
  history.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'review-item ' + (h.userCorrect ? 'ok' : 'bad');
    div.innerHTML = `<strong>${i+1}. ${h.q}</strong><br><span style="color:var(--muted); font-size:.85rem;">Respuesta correcta: ${h.options[h.answer]}</span>`;
    reviewList.appendChild(div);
  });
}

document.getElementById('restart-btn').addEventListener('click', () => {
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('setup-card').style.display = 'block';
});
</script>
</body>
</html>
